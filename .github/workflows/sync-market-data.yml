name: Sync Market Data

on:
  schedule:
    - cron: '30 21 * * 1-5' # weekdays, ~4:30pm ET after market close
  workflow_dispatch: {}

permissions:
  contents: write

# A manual workflow_dispatch racing the daily schedule (or a retry) would
# otherwise let two runs write/commit/push at once and fight over the same
# files — queue instead of running side by side.
concurrency:
  group: sync-market-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-market-data.mjs
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
      - run: |
          git config user.name "confluence-bot"
          git config user.email "actions@github.com"
          git add public/market-data.json public/track-record.json
          git diff --staged --quiet || git commit -m "Sync market data ($(date -u +%Y-%m-%d))"
          git push
