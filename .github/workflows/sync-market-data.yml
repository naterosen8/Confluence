name: Sync Market Data

on:
  schedule:
    - cron: '30 21 * * 1-5' # weekdays, ~4:30pm ET after market close
  workflow_dispatch: {}

permissions:
  contents: write

# A manual workflow_dispatch racing the daily schedule (or a retry) would
# otherwise let two runs write/commit/push at once and fight over the same
# files — queue instead of running side by side.
concurrency:
  group: sync-market-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 8 requests/minute on the free tier means the price fetch alone is
    # ~7.5s x the ticker count — around 11 minutes at 89 symbols. Twenty left
    # no headroom for a slow response or a retry, and a job killed mid-fetch
    # commits nothing at all.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-market-data.mjs
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
      # Balance sheets only move quarterly and this is a separate free source
      # (SEC EDGAR, no key). A failure here must not lose the day's price sync,
      # so it is allowed to fail without failing the job.
      - run: node scripts/sync-fundamentals.mjs
        continue-on-error: true
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
      # Rebase-and-retry rather than a bare push. The concurrency group stops
      # two sync runs racing each other, but nothing stops an ordinary commit
      # landing on main during the ~4 minutes this job spends fetching — and
      # when that happened the push was rejected and a completed, correct sync
      # was thrown away. Rebasing keeps the fetched data and reapplies it on
      # top of whatever arrived meanwhile.
      - run: |
          git config user.name "confluence-bot"
          git config user.email "actions@github.com"
          git add public/bars public/track-record.json public/track-record-summary.json public/screener.json
          git add public/fundamentals.json || true
          if git diff --staged --quiet; then
            echo "Nothing changed; not committing."
            exit 0
          fi
          git commit -m "Sync market data ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 10
          done
          echo "Could not push after 3 attempts."
          exit 1
