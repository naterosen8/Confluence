<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confluence — Live TA Screener</title>
    <meta name="description" content="What a stock has already done to people who bought it: how big is too big, how far down it goes, and whether it comes back. Measured, not predicted — and it will not tell you what to buy." />
    <meta name="theme-color" content="#0d9488" />
    <link rel="canonical" href="https://confluence-self.vercel.app/" />

    <!-- Inter for the interface, with the numeric faces that matter on a page
         made mostly of figures: tabular lining numerals so columns align and
         a price does not jitter as it ticks. preconnect because the font is
         render-blocking for the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Confluence" />
    <meta property="og:title" content="Confluence — what a stock has already done to people who bought it" />
    <meta property="og:description" content="How big is too big, how far down it goes, and whether it comes back. Every call published in advance and scored — the hit rate is a coin flip, which is why this site will not tell you what to buy." />
    <meta property="og:url" content="https://confluence-self.vercel.app/" />
    <meta property="og:image" content="https://confluence-self.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Confluence — what a stock has already done to people who bought it" />
    <meta name="twitter:description" content="How big is too big, how far down it goes, and whether it comes back. Every call published in advance and scored — the hit rate is a coin flip, which is why this site will not tell you what to buy." />
    <meta name="twitter:image" content="https://confluence-self.vercel.app/og-image.png" />
  </head>
  <body>
    <script>
      // Inline and blocking on purpose: applied before first paint so a
      // light-theme visitor never sees a flash of the dark palette while the
      // bundle loads. Mirrors resolveTheme() in src/lib/theme.js.
      (function () {
        try {
          var stored = localStorage.getItem('confluence.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
